name: Build and Deploy to GitHub Pages (User Page)

on:
  push:
    branches:
      - source

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build
      
      - name: Copy index.html to 404.html
        run: cp dist/index.html dist/404.html

      - name: Deploy to main (GitHub Pages root)
        uses: peaceiris/actions-gh-pages@v3
        with:
          personal_token: ${{ secrets.PAGES_TOKEN }}
          publish_dir: ./dist
          publish_branch: main
          force_orphan: true
